[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mementohls"
version = "0.1.0"
description = "Memory-guided multi-round HLS code generation and repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "psutil",
  "PyYAML",
  "requests",
  "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]
