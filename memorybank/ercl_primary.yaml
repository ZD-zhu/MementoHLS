    for (int bit=0; bit<6; ++bit) { rev |= ((i >> bit) & 1) << (5-bit); } if (i < rev) { std::complex<float>
    tmp=x[i]; x[i]=x[rev]; x[rev]=tmp; } } const float pi=3.14159265358979323846f; for (int len=2; len<=64;
