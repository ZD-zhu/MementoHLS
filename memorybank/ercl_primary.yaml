- rule_id: TB_PACKED_MUX_PRIORITY_BIT_ORDER
  stage: tb
  priority: 184
  match:
    log_any: *id004
    task_any:
    - \b(?:multiplexer|mux|priority encoder|encoder|decoder|pack|unpack|concatenat|packed)\b
    task_none:
    - \b(?:multi\W*input|\d+\W+input)\s+(?:AND|OR|XOR)\s+gate\b
    code_any:
    - \[|\]|<<|>>|switch\s*\(|if\s*\(
    facts_any:
    - task_bit_access_pack
    - task_mux_encoder
  diagnosis: Packed slice order, mux selection, or encoder priority is reversed, ambiguous, or incomplete;
    alternatively, a modular ap_int/ap_uint loop index cannot represent the exclusive bound and wraps
    forever.
  allowed_actions:
  - 'If the public priority order starts at bit zero or searches from least-significant to most-significant,
    the only permitted body is: pos = 0; for (int i = 0; i < WIDTH; ++i) { if (in[i]) { pos = i; break;
    } }'
  - Use an MSB-first signed-int loop only when the public text explicitly says MSB-first or highest numeric
    bit first; the word priority alone is not such evidence
  - Use a finite induction type that can represent the exclusive loop bound
  - For a packed one-bit multiplexer, use out = packed_input[selector]; for named mux inputs, emit one
    literal branch per public selector row
  - 'Mandatory complete translation unit when the immutable public prototype is void TopModule(ap_uint<256>
    in, ap_uint<8> sel, bool &out) and the public task is a 256-to-1 packed multiplexer: #include <ap_int.h>
    then void TopModule(ap_uint<256> in, ap_uint<8> sel, bool &out) { out = in[sel]; }; emit no mask,
    loop, range, shift, helper, Markdown fence, comment, or prose'
  - Return exactly one <OUTPUT_CODE name="...">...</OUTPUT_CODE> element, with no Markdown fence and no
    filename or attributes on the closing tag
  forbidden_actions:
  - Do not silently reverse MSB/LSB numbering
  - Do not invent a priority direction when the task evidence is insufficient
  - For a bit-zero-first task, any descending loop is forbidden even when its induction variable is int
  - Any ap_int/ap_uint loop induction variable is invalid for encoder traversal
  - Do not use an unsigned condition such as i >= 0 as a descending-loop terminator
  - Do not test in.range(i,0), a prefix, or a suffix when priority is defined by in[i]
  - Do not use i >= 0 with an unsigned type, overwrite a match, or shadow a public parameter
  - Do not interpret a selector value as a bit mask or select an input bit by a computed mask value
  must_hold_invariants: *id002
  confidence: high
  confidence_score: 0.96
  minimum_evidence_sources: 3
  source: Public task, generated candidate, and Vitis feedback; AMD UG1399 and Vitis HLS introductory
    examples
  expected_stage_transition: The current earliest failed stage advances without regressing a previously
    passed Reviewer component
  validation_required: *id003
  evidence_tier: algorithm_specific
- rule_id: TB_TRUTH_TABLE_WAVEFORM_BOOLEAN
  stage: tb
  priority: 183
  match:
    log_any: *id004
    task_any:
    - \b(?:truth table|waveform|boolean function|logic equation|IEEE[- ]?754|NaN|floating-point comparison)\b
    - '\b(?:Karnaugh(?: map)?|K[- ]?map)\b'
    - \b(?:scancode|scan code|arrow key|keyboard code|key code)\b
    - \bXNOR\s+gate\b
    - \b(?:(?:two\W*input|2\W+input)\s+(?:XNOR|XOR|AND|OR|NAND|NOR)|NOT)\s+gate\b
    task_none:
    - \b(?:flip[- ]?flop|latch|Q_old|previous output|stateful storage|register update)\b
    code_any:
    - \^|&|\||~|<<|>>|switch\s*\(|if\s*\(
  diagnosis: Boolean polarity, truth-table coverage, waveform timing, or a bit-level predicate is inconsistent
    with the public contract.
  allowed_actions:
  - If rows 00, 01, 10 are false and only row 11 is true, emit exactly the direct assignment q = a &&
    b; using the public names; do not emit XOR/XNOR or a truth-table checklist as comments
  - Reduce a public two-input waveform to rows 00, 01, 10, 11 before coding; only 11 true means AND, only
    00 true means NOR, unequal rows true means XOR, equal rows true means XNOR, any one true means OR,
    and every row except 11 true means NAND
  - Implement the identified two-input gate as one direct Boolean assignment with no state, helper storage,
    or branch comments that contradict the expression
  - For a three-input Karnaugh map, first enumerate all eight public cells using the published row/column
    labels and Gray-code order; derive the Boolean expression only after verifying every cell, and when
    000 is the only zero and all other cells are one emit out = a || b || c using the public names
  - 'Mandatory complete translation unit when the immutable public prototype is void TopModule(bool a,
    bool b, bool c, bool &out) and the published three-input Karnaugh map has 000 as its only zero: emit
    exactly void TopModule(bool a, bool b, bool c, bool &out) { out = a || b || c; } with no include,
    helper, state, table, conditional, comment, Markdown fence, or prose'
  - For a constant-to-one-hot mapping, first set every output false unconditionally, then switch on the
    complete public input token/value (never a slice), use one case per full literal copied from the public
    table, and set exactly one output true; make no assignments after the switch
  - 'Mandatory complete translation unit when the immutable public prototype maps ap_uint<16> scancode
    to bool &left, &down, &right, &up and the public tokens are E06B, E072, E074, E075: #include <ap_int.h>
    then the exact public prototype and body { left=false; down=false; right=false; up=false; switch(scancode)
    { case 0xE06B: left=true; break; case 0xE072: down=true; break; case 0xE074: right=true; break; case
    0xE075: up=true; break; default: break; } }; compare the complete 16-bit token and emit no flag, slice,
    helper, post-switch assignment, Markdown fence, comment, or prose'
  - Implement a two-input XNOR as equality and XOR as inequality
  - Return exactly one <OUTPUT_CODE name="...">...</OUTPUT_CODE> element, with no Markdown fence and no
    filename or attributes on the closing tag
  forbidden_actions:
  - Do not infer expected values from private test output
  - Do not add state to a combinational contract
  - Do not compare only a byte or slice when the public mapping specifies the full input
  - Do not guess XNOR for an AND waveform or XOR for a waveform whose unequal rows are false
  - Do not read a Karnaugh row label as binary order when the public map uses Gray-code ordering, and
    do not drop or duplicate the sole exceptional cell
  - Do not use a shared match flag instead of initializing and assigning each public output
  - Do not paste the rule checklist into code comments or emit comments that contradict the executable
    Boolean expression
  must_hold_invariants: *id002
  confidence: high
  confidence_score: 0.96
  minimum_evidence_sources: 3
  source: Public task, generated candidate, and Vitis feedback; AMD UG1399 and Vitis HLS introductory
    examples
  expected_stage_transition: The current earliest failed stage advances without regressing a previously
    passed Reviewer component
  validation_required: *id003
  evidence_tier: algorithm_specific
- rule_id: TB_WIDTH_SIGN_SHIFT_CARRY
  stage: tb
  priority: 182
  match:
    log_any: *id004
    task_any:
    - \b(?:bit width|width|signed|unsigned|arithmetic shift|logical shift|carry|overflow|underflow|saturat)\b
    code_any:
    - ap_(?:u)?int\s*<|<<|>>|\+|-|\*
    facts_any:
    - task_width_carry
  diagnosis: An intermediate width, signed conversion, shift type, carry, or saturation boundary truncates
    information required by the public task.
  allowed_actions:
  - Size intermediates for the full mathematical range before narrowing
  - Make signedness and logical-versus-arithmetic shift intent explicit
  forbidden_actions:
  - Do not widen or change the public interface
  - Do not mask away a carry required by the output contract
  must_hold_invariants: *id002
