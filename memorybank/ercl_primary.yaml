sources:
- public HLS benchmark, arXiv:2504.12268
- KernelSkill, arXiv:2603.10085
- ChatHLS, ACL 2026
- AMD Vitis HLS UG1399 2024.2
- 'AMD UG1399 2024.2 Pointer Limitations: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/Pointer-Limitations'
- 'AMD UG1399 2024.2 Unsupported C/C++: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/Unsupported-C/C-Constructs'
- 'AMD UG1399 2024.2 Dynamic Memory: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/Dynamic-Memory-Usage'
- 'AMD UG1399 2024.2 System Calls: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/System-Calls'
