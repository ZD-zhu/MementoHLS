- rule_id: COMPILE_SIGNATURE_ARRAY_POINTER_INPLACE
  stage: compile
  priority: 181
  match:
    log_any:
    - conflicting types
    - no matching function
    - cannot convert
    - invalid conversion
    - subscripted value
    - incompatible pointer
    - undefined symbol:\s*(?i:top(?:module)?|dut|kernel)\s*\(
    task_any:
    - \b(?:function signature|prototype|array|pointer|in-place|in place|top function|TopModule|topmodule)\b
    code_any:
    - \[[^\]]*\]|\*|&
    facts_any:
    - task_signature_array_inplace
  diagnosis: An exact demangled undefined symbol for the public top function proves the parameter ABI
    required by the executable link contract. C++ ABI-distinct types such as bool& and ap_uint<1>& are
    not interchangeable. When public prose and that exact linker parameter list disagree, use the linker-required
    types for only the mismatching declaration fields; this does not authorize an algorithm or control-flow
    change.
  allowed_actions:
  - For an exact undefined public top symbol, perform one declaration-only edit by copying its complete
    demangled parameter types, order, qualifiers, extents, and pointer/reference levels into the existing
    top definition
  - If the linker requests F(..., ap_uint<1>&) while the candidate defines F(..., bool&), replace only
    bool& with ap_uint<1>& and preserve the complete function body
  - The exact linker parameter ABI outranks contradictory natural-language type prose for only the mismatching
    fields; preserve the public/header case-sensitive top name and every non-mismatching declaration field
  - For compile diagnostics other than an exact undefined public top symbol, restore the exact public
    or immutable-header prototype
  - Preserve in-place reads before overwriting aliased outputs
  forbidden_actions:
  - Do not add wrappers, overloads, or alternate top functions
  - Do not change fixed array dimensions or pointer ownership
  - Do not retain bool& after the exact linker ABI requests ap_uint<1>&
  - Do not repair a linker-only declaration mismatch by changing if/switch structure, branches, loops,
    constants, state, or output assignments
  - Do not apply this rule to an unresolved helper unless the immutable public task independently identifies
    that exact helper as the top function; otherwise abstain
  must_hold_invariants:
  - The emitted top definition matches the exact linker-required parameter ABI
  - Preserve the public/header case-sensitive top name and all non-mismatching declaration fields
  - Preserve the candidate algorithm body and its control/data flow
  - Do not read or infer from a reference implementation or testbench body
  - Use only finite statically bounded synthesizable control and storage
  confidence: high
  confidence_score: 0.94
  minimum_evidence_sources: 3
  source: Public task, generated candidate, and Vitis feedback; AMD UG1399 and Vitis HLS introductory
    examples
  expected_stage_transition: The current earliest failed stage advances without regressing a previously
    passed Reviewer component
  validation_required: *id003
  evidence_tier: algorithm_specific
  conflict_class: exact_public_top_abi
retrieval_policy:
  top_k: 1
  conflict_precedence:
  - exact_public_top_abi
  - immutable_interface
  - exact_negative_evidence
  - exact_tool_error
  - exact_code_or_header_feature
  - general_hls_compatibility
  - tb_semantic_hypothesis
  global_veto:
  - Never modify headers, testbenches, data files, fixed dimensions, or the top-function algorithm; only
    a selected compile-signature rule may restore the existing top declaration to an exact linker-reported
    public ABI
  - Never retrieve or prompt the reference kernel
  - Never use QoR to choose a candidate
  fallback_policy: abstain_to_feedback
  specificity_policy: Alternatives inside one any-clause count as one broad condition; exact negative
    evidence is prioritized
  cleanroom_authorization_policy: STAGNATION_CLEANROOM rules are action-side and excluded before Diagnoser
    top-k ranking
  promotion_policy: Short-memory reflections remain trajectory-local and are never written back into frozen
    Long memory
  stage_frontier_policy: Diagnose and repair only the earliest failed Parse-Compile-TB-Synth stage; preserve
    every already-passed stage
  evidence_contract:
  - Every selected rule must cite a concrete log, code, immutable-header, or trajectory-state observation
  - Exact negative evidence and compiler identifiers outrank broad lexical hypotheses
  - A contradicted Short-memory root cause or repeated failed action cannot be reused without new evidence
  action_contract:
  - Deterministic operators require a high-confidence authorized rule plus precondition and postcondition
    checks
  - An operator no-op is not a candidate and falls back to one Repairer call
  - Every candidate must pass a complete independent Reviewer; no cross-round TB/Synth composition is
    allowed
  minimum_authorization_score: 0.58
  minimum_runner_up_margin: 0.04
  independent_evidence_policy: Primary reusable contracts require evidence from the public task, generated
    candidate, derived facts, or Vitis log; dataset labels and problem IDs are forbidden.
  empirical_quarantine_policy: Rules selected at least 20 times with zero success or below 5% progress
    receive deterministic reliability penalties.
