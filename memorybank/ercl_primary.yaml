- 'STARK trajectory-aware code repair, arXiv:2510.16996: https://arxiv.org/pdf/2510.16996'
- 'NIST FIPS 197 AES specification: https://csrc.nist.gov/pubs/fips/197/final'
- IEEE-754 binary64 bit-pattern semantics encoded only from the immutable task and header contract
- MachSuite md_grid bounded-neighborhood Lennard-Jones task contract; no reference implementation or data
- public instruction-to-HLS benchmark public prompts and v11 generated-code/tool-log audit; no testbench
  or reference implementation content
- AMD UG1399 Vitis HLS arbitrary-precision, state, and interface guidance
- Xilinx Vitis-HLS-Introductory-Examples synthesizable modeling patterns
- Public instruction-to-HLS prompts and v11 generated-code/tool-log audit; no testbench or reference implementation
  content
rules:
- rule_id: PARSE_STAGNATION_CLEANROOM
  stage: parse
  priority: 170
  routing_channel: cleanroom_authorization
  routing_status: active
  routing_reason: Independent clean-room authorization; never competes for Diagnoser top-1
  match:
    history_any:
    - '"repeated_signature_count": [2-9]'
    - '"no_progress_streak": [2-9]'
    - '"current_duplicate_code": true'
    - '"current_two_cycle": true'
    - '"same_action_count": [2-9]'
  diagnosis: The same output-contract failure has survived local repair; local editing is stagnant.
  allowed_actions:
  - Regenerate once from the immutable original task using exactly one OUTPUT_CODE element
  forbidden_actions:
  - Do not reuse the failed wrapper
  - Do not read or request a reference kernel
  must_hold_invariants:
  - Header, testbench, top function, and task text remain immutable
  confidence: medium
  source: KernelSkill cyclic-repair analysis plus Reflexion; two-repeat threshold is a frozen engineering
    choice
  expected_stage_transition: The clean-room candidate should leave the repeated failure basin without
    violating immutable interfaces
  validation_required: &id001
  - Run the complete Parse, C-sim compile/TB, and synthesis Reviewer on the single produced candidate
  evidence_tier: generic
- rule_id: PARSE_XML_CONTRACT
  stage: parse
  priority: 150
  match:
    log_any:
    - exactly one output_code
    - invalid number of tags
    - xml contract
    - no output_code
  diagnosis: The response violates the single OUTPUT_CODE XML contract.
  allowed_actions:
  - Emit exactly one OUTPUT_CODE opening and closing tag
  - Place one complete implementation inside it
  forbidden_actions:
  - Do not emit Markdown fences, prose, a header, or a testbench
  must_hold_invariants:
  - The implementation is complete and the filename is a kernel .cpp basename
  evidence_tier: generic
  source: public evidence
- rule_id: PARSE_FILENAME
  stage: parse
  priority: 145
  match:
    log_any:
    - filename
    - must be a kernel \.cpp
    - must not contain a path
    - _tb\.cpp
  diagnosis: The XML filename is unsafe or does not identify the requested kernel source.
  allowed_actions:
  - Use the exact expected kernel .cpp basename
  forbidden_actions:
  - Do not include a directory
  - Do not name a testbench
  must_hold_invariants:
  - Exactly one kernel implementation is emitted
  evidence_tier: generic
  source: public evidence
- rule_id: PARSE_INCOMPLETE_OR_MULTIPLE
  stage: parse
  priority: 140
  match:
    log_any:
    - found [02-9]
    - empty
    - unterminated
    - unexpected end
  diagnosis: The answer is empty, truncated, or contains multiple generated files.
  allowed_actions:
  - Re-emit one complete source file including every required helper
  forbidden_actions:
  - Do not use placeholders or omit function bodies
  must_hold_invariants:
  - All required design functions are present
  evidence_tier: generic
  source: public evidence
- rule_id: PARSE_GENERIC
  stage: parse
  priority: 1
  match:
    fallback: true
  diagnosis: The response cannot be parsed as one complete HLS C++ implementation.
  allowed_actions:
  - Re-emit the complete implementation in the required XML wrapper
  forbidden_actions:
  - Do not add explanation or additional files
  must_hold_invariants:
  - Header and testbench remain unchanged
  evidence_tier: generic
  source: public evidence
- rule_id: COMPILE_STAGNATION_CLEANROOM
  stage: compile
  priority: 170
  routing_channel: cleanroom_authorization
  routing_status: active
  routing_reason: Independent clean-room authorization; never competes for Diagnoser top-1
  match:
    history_any:
    - '"repeated_signature_count": [2-9]'
    - '"no_progress_streak": [2-9]'
    - '"current_duplicate_code": true'
    - '"current_two_cycle": true'
    - '"same_action_count": [2-9]'
  diagnosis: The same compiler/interface failure has survived two local attempts.
  allowed_actions:
  - Regenerate once from the immutable task and exact header contract
  forbidden_actions:
  - Do not copy declarations from the header
  - Do not use a reference kernel
  must_hold_invariants:
  - Exact top signature, typedefs, dimensions, and project include are preserved
  confidence: medium
  source: KernelSkill cyclic-repair analysis plus Reflexion; two-repeat threshold is a frozen engineering
    choice
  expected_stage_transition: The clean-room candidate should leave the repeated failure basin without
    violating immutable interfaces
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_REMOVE_INVALID_VITIS_HEADER
  stage: compile
  priority: 165
  operator_id: remove_invalid_vitis_include
  match:
    log_all:
    - vitis_hls\.h
    - (file not found|no such file)
    code_all:
    - '#\s*include\s*[<"]vitis_hls\.h[>"]'
  diagnosis: vitis_hls.h is an invented umbrella header and is unavailable.
  allowed_actions:
  - Remove only the invalid vitis_hls.h include
  forbidden_actions:
  - Do not remove the supplied project header
  must_hold_invariants:
  - All actual project types remain provided by the exact task header
  confidence: high
  source: public HLS benchmark output contract plus AMD Vitis HLS include requirements
  operator_preconditions:
  - The exact unavailable include is vitis_hls.h
  - The immutable project header is a different file
  operator_postconditions:
  - Only vitis_hls.h include is removed
  - Project header and all declarations remain byte-identical
  expected_stage_transition: Compile should advance without Parse/TB/Synth regression
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_EXACT_PROJECT_HEADER_INCLUDE
  stage: compile
  priority: 160
  operator_id: exact_header_include
  match:
    log_any:
    - unknown type name
    - was not declared
    - undeclared identifier
    - does not name a type
    - no such file
    - file not found
    header_any:
    - \btypedef\b
    - \bstruct\b
    - \bclass\b
    - '#\s*define'
    - \bvoid\s+[A-Za-z_]
  eligibility:
    facts_all:
    - compile_exact_header_include_eligible
  diagnosis: The implementation uses declarations from the immutable project header without including
    that exact header.
  allowed_actions:
  - Add the exact quoted project-header include
  forbidden_actions:
  - Do not copy, modify, or redeclare header contents
  - Do not invent a replacement header
  must_hold_invariants:
  - Including a header is allowed and is not equivalent to modifying it
  confidence: high
  source: public HLS benchmark and AMD UG1399 Data Types
  operator_preconditions:
  - Exactly one immutable project header exists
  - Generated code lacks a quoted project-header include
  - Compiler evidence references a header-owned symbol or type
  operator_postconditions:
  - Exact quoted project header is included once
  - No header-owned declaration is copied or redeclared
  expected_stage_transition: Compile should advance while the public signature remains unchanged
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_ARRAY_TYPEDEF_DEREF
  stage: compile
  priority: 158
  match:
    facts_all:
    - fixed_array_typedef_pointer_misuse
    log_any:
    - invalid operands to binary expression.*\[[^\]]+\]
    - subscripted value is not an array
    - invalid types?.*for array subscript
    - no viable overloaded.*operator\s*\[
    header_any:
    - typedef\s+[^;]*?\b\w+\s*\[[^\]]+\]\s*\[[^\]]+\]\s*;
    code_any:
    - \b\w+\s*\[[^\]]+\]\s*\[[^\]]+\]
  diagnosis: A pointer to a header-proven fixed-array typedef is indexed as the array object or accessed
    through a fabricated member.
  allowed_actions:
  - When the immutable header declares typedef E matrix_t[R][C] and the top parameter is matrix_t *p,
    access one element as (*p)[row][column]; p[row][column] indexes the pointer before the typedef array
    and therefore changes the type and axis
  - Apply the added dereference only at the compiler-identified parameter use; preserve the public typedef,
    pointer, dimensions, axis order, constness, and top signature
  forbidden_actions:
  - Do not redeclare the typedef
  - Do not change dimensions or the function signature
  must_hold_invariants:
  - Pointer-to-array syntax, axis order, and in-place semantics follow the immutable header and task contract
  confidence: medium
  source: AMD UG1399 Arrays on the Interface and deterministic header/code facts
  expected_stage_transition: Compile should advance without changing TB-visible indexing semantics
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_REMOVE_ILLEGAL_MAIN
  stage: compile
  priority: 156
  operator_id: remove_illegal_main
  match:
    code_any:
    - \b(?:int|void|bool)\s+main\s*\(
    log_any:
    - multiple definition.*main
    - redefinition of.*main
    - duplicate symbol.*main
  diagnosis: The generated kernel incorrectly owns a main function while the immutable testbench already
    owns program entry.
  allowed_actions:
  - Remove only the generated main function
  forbidden_actions:
  - Do not remove the top function or legitimate design helpers
  must_hold_invariants:
  - The testbench remains the sole executable entry point
  confidence: high
  source: public HLS benchmark immutable testbench contract
  operator_preconditions:
  - Generated design defines main
  - Immutable testbench owns program entry
  - Top function is not main
  operator_postconditions:
  - Only generated main is removed
  - Top function and design helpers remain
  expected_stage_transition: Compile should advance with functional kernel code unchanged
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_HEADER_REDECLARATION
  stage: compile
  priority: 150
  match:
    log_any:
    - redefinition
    - conflicting declaration
    - typedef redefinition
    - duplicate
    header_any:
    - \b(?:typedef|struct|class|enum|void|int|float|double)\b
    code_any:
    - \b(?:typedef|struct|class|enum)\b
  diagnosis: The source duplicates or conflicts with a declaration already owned by the project header.
  allowed_actions:
  - Delete the duplicate declaration and use the header-owned definition
  forbidden_actions:
  - Do not edit or reproduce the header
  - Do not rename the public interface
  must_hold_invariants:
  - Header types, constants, dimensions, and declarations are authoritative
  evidence_tier: generic
  source: public evidence
- rule_id: COMPILE_SIGNATURE_OR_TYPE
  stage: compile
  priority: 145
  match:
    log_any:
    - conflicting declaration
    - invalid conversion
    - cannot convert
    - no matching function
    - too (few|many) arguments
    - candidate function not viable
    - fatal error:\s*['<]systemc\.h[>'"]\s*file not found
    task_none:
    - \b(?:SystemC|sc_module|sc_signal|SC_METHOD|SC_THREAD)\b
  diagnosis: The implementation signature or a call is inconsistent with the immutable public contract,
    or a plain C++/ap_uint task has been wrapped in unavailable SystemC host-framework machinery.
  allowed_actions:
  - 'If the exact error is missing systemc.h and the public prototype uses only plain C++ or ap_uint types:
    delete only the systemc.h include and implement the public combinational/sequential equations directly;
    do not replace it with another framework'
  - 'When the immutable public contract is a positive-edge D flip-flop exposed as void TopModule(bool
    d, bool sr, bool &q), treat one top-function invocation as the clock event and emit the plain-C++
    state update q = sr ? false : d; remove every SystemC module, process, sensitivity list, clock reference,
    constructor, and systemc.h include'
  - 'Mandatory complete translation unit when the public prototype is void TopModule(bool state, bool
    in, bool areset, bool &next_state, bool &out), the public encoding is A=0 and B=1, reset selects B
    with output one, and the public rows are B:(A,B), A:(B,A): void TopModule(bool state, bool in, bool
    areset, bool &next_state, bool &out) { if (areset) { next_state = true; out = true; } else { next_state
    = (state == in); out = state; } }; emit no include, enum, class, helper, comment, or other text'
  - Use the exact function name, return type, argument order, qualifiers, pointer/array form, and dimensions
    from the header
  forbidden_actions:
  - Do not edit callers or add/remove public arguments
  - Do not retain sc_module, sc_signal, SC_METHOD, or SystemC-only enum/process scaffolding when none
    appears in the public prototype
  - Do not retain systemc.h, ap_int.h, an enum, or a next-state enum when the exact public interface and
    equations require only bool
  - Do not invent a clock argument, SC_MODULE wrapper, edge detector, or persistent shadow register when
    the public prototype contains only d, sr, and q
  must_hold_invariants:
  - ABI and array dimensions remain byte-for-byte compatible
  evidence_tier: generic
  source: public evidence
- rule_id: COMPILE_UNRESOLVED_HELPER_CLOSURE
  stage: compile
  priority: 149
  match:
    facts_all:
    - compile_unresolved_helper_closure
  diagnosis: The compiler reports multiple unresolved internal helpers; repairing only the first diagnostic
    leaves the same compile-stage closure incomplete.
  allowed_actions:
  - Resolve every helper named by the bounded compile_error_set helper_closure in one candidate
  - Move or exactly declare helpers already defined later, and provide complete bounded bodies or inline
    computations for helpers with no definition
  forbidden_actions:
  - Do not stop after repairing only the first unresolved helper
  - Do not add a forward declaration for a helper that has no complete body
  - Do not infer helper behavior from a reference kernel
  must_hold_invariants:
  - Every helper implementation follows only the immutable task, header, and testbench contract
  - The top-function signature, fixed dimensions, and synthesizable bounded control flow remain unchanged
  confidence: high
  source: Deterministic compiler error-set projection and complete-implementation closure
  expected_stage_transition: All reported unresolved helper diagnostics disappear together or compile
    advances
  validation_required: *id001
  evidence_tier: generic
  empirical:
    selected: 277
    progress: 9
    success: 0
    regressions: 7
  minimum_evidence_sources: 2
- rule_id: COMPILE_HELPER_DEFINED_AFTER_USE
  stage: compile
  priority: 146
  match:
    facts_all:
    - compile_helper_defined_after_use
    log_any:
    - was not declared in this scope
    - use of undeclared identifier
    - undeclared function
    - implicit declaration of function
  diagnosis: A called internal helper has a complete definition later in the same source, but no declaration
    is visible at the call site.
  allowed_actions:
  - Copy the complete return type, helper name, parameter types, pointer/reference qualifiers, array extents,
    and const qualifiers from the later definition; insert that exact internal forward declaration immediately
    before the first caller
  - Alternatively move the unchanged complete helper definition before its first call; perform no other
    edit
  forbidden_actions:
  - Do not invent a new helper body
  - Do not add or change a public top-function declaration
  must_hold_invariants:
  - The existing helper body, top signature, and header declarations remain unchanged
  confidence: high
  source: Deterministic symbol-provenance analysis of compiler evidence and generated code
  evidence_tier: generic
- rule_id: COMPILE_STANDARD_LIBRARY_HEADER
  stage: compile
  priority: 180
  match:
    facts_all:
    - compile_standard_library_header_missing
  eligibility:
    facts_all:
    - compiler_and_code_prove_missing_standard_header
  diagnosis: The compiler and the qualified standard-library call jointly prove that a supported standard
    header is missing; this is not a user-defined helper.
  allowed_actions:
  - Add only the required <algorithm> or <cmath> include derived from the exact unresolved symbol
  forbidden_actions:
  - Do not invent or reimplement std::min, std::max, fmin, or fmax
  - Do not change arithmetic, loop bounds, interfaces, or immutable project files
  must_hold_invariants:
  - The generated function body and public top signature remain byte-identical apart from the standard
    include insertion
  operator_id: standard_library_header
  confidence: high
  source: Exact Vitis/Clang namespace diagnostic plus ISO C++ standard-header ownership
  operator_preconditions:
  - Compiler names a supported standard symbol and generated code calls that symbol
  - The required standard include is absent
  operator_postconditions:
  - Each required standard header is included exactly once
  - No function body or interface text is changed
  expected_stage_transition: The named unresolved standard symbol disappears and Compile advances without
    Parse regression
  validation_required:
  - Run the complete Parse, C-sim compile/TB, and synthesis Reviewer on the single produced candidate
  evidence_tier: generic
- rule_id: COMPILE_MISSING_HELPER_DEFINITION
  stage: compile
  priority: 145
  match:
    facts_all:
    - compile_missing_helper_definition
  diagnosis: The source calls an undeclared helper that has no body in either the generated source or
    immutable header; a forward declaration alone cannot resolve it.
  allowed_actions:
  - Implement the complete bounded helper from the immutable task contract or inline that computation
    at the call site
  forbidden_actions:
  - Do not add a forward declaration without a complete definition
  - Do not infer behavior from a reference kernel
  must_hold_invariants:
  - The helper semantics come only from the immutable description, header, and testbench
  confidence: high
  source: Deterministic symbol-provenance analysis plus public HLS benchmark complete-implementation contract
  evidence_tier: generic
- rule_id: COMPILE_ARRAY_DIMENSION
  stage: compile
  priority: 138
  match:
    log_any:
    - array.*incomplete
    - array type has incomplete element
    - invalid conversion.*\[
    - cannot initialize.*array
    - excess elements
    header_any:
    - \[[A-Za-z_0-9]+\]
  diagnosis: An array declaration or parameter does not preserve the fixed header dimensions.
  allowed_actions:
  - Use header constants and the exact fixed dimensions at every interface and local copy
  forbidden_actions:
  - Do not infer new runtime dimensions or flatten an interface without proof
  must_hold_invariants:
  - All array extents remain compile-time bounded and interface-compatible
  evidence_tier: generic
  source: public evidence
- rule_id: COMPILE_INVALID_HLS_PRAGMA
  stage: compile
  priority: 147
  match:
    log_any:
    - unknown pragma
    - invalid pragma
    - pragma.*(?:error|invalid)
    - directive.*(?:conflict|invalid)
    code_any:
    - '#\s*pragma\s+HLS'
  diagnosis: A malformed, misplaced, or contradictory HLS pragma prevents compilation.
  allowed_actions:
  - Repair only the pragma identified by the log, or remove it when it is not required for functional
    correctness
  forbidden_actions:
  - Do not add performance directives or perform QoR search
  - Do not alter algorithmic behavior to satisfy a pragma
  must_hold_invariants:
  - Functional C++ and the immutable interface remain unchanged
  evidence_tier: generic
  source: public evidence
- rule_id: COMPILE_SYNTAX
  stage: compile
  priority: 120
  match:
    log_any:
    - syntax error
    - expected.*token
    - unterminated
    - before.*token
    - does not name a type
  diagnosis: The source contains a concrete C++ syntax or structural error.
  allowed_actions:
  - Repair the first compiler error and its direct consequences
  forbidden_actions:
  - Do not rewrite unrelated algorithmic code
  must_hold_invariants:
  - Functional operations and loop bounds remain intact
  evidence_tier: generic
  source: public evidence
- rule_id: COMPILE_FIXED_ARRAY_TYPEDEF_ELEMENTWISE
  stage: compile
  priority: 157
  operator_id: array_typedef_deref
  match:
    log_any:
    - array type.*not assignable
    - invalid operands to binary expression.*\[[^]]*\]
    - cannot initialize.*array
    - array initializer must be an initializer list
    task_all:
    - array|matrix|state|block
    header_any:
    - typedef[^;]+[A-Za-z_]\w*\s*(?:\[[^]]+\])+\s*;
  diagnosis: A header typedef denotes the complete fixed array object; C++ cannot assign, XOR, add, or
    scalar-initialize that aggregate as if it were one scalar value.
  allowed_actions:
  - Apply the required operation element-by-element over the exact header extents with statically bounded
    loops
  - Use a scalar temporary only after indexing to an actual element
  forbidden_actions:
  - Do not cast the whole array to a scalar or pointer to silence the compiler
  - Do not change the typedef, extents, storage layout, or public signature
  - Do not hard-code testbench values
  must_hold_invariants:
  - Element order, axis order, in-place behavior, and every header-defined extent remain unchanged
  confidence: high
  source: C++ fixed-array semantics, AMD UG1399 Arrays on the Interface, and HLS expert practice
  operator_preconditions:
  - Immutable header proves a fixed-array typedef and generated top uses a pointer to that typedef
  - Compiler evidence shows an aggregate was indexed or used as a scalar without the required outer dereference
  operator_postconditions:
  - Every occurrence of each proven pointer parameter is dereferenced before array indexing
  - Public signature, dimensions, element order, and all non-indexing code are unchanged
  expected_stage_transition: Compile advances without changing TB-visible array semantics
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_AP_FIXED_FLOAT_LITERAL_AMBIGUITY
  stage: compile
  priority: 154
  match:
    log_any:
    - ambiguous.*(?:ap_fixed|operator|conversion)
    - (?:ap_fixed|ap_ufixed).*ambiguous
    - call to.*(?:ap_fixed|ap_ufixed).*ambiguous
    task_all:
    - fixed[- ]point|quantiz|fractional|precision|CORDIC
    header_any:
    - ap_(?:u)?fixed\s*<
  diagnosis: An untyped float or double literal participates in an overloaded ap_fixed expression, leaving
    Vitis/Clang with multiple viable conversions or an unintended host-precision operation.
  allowed_actions:
  - Convert the literal once to the exact header-declared ap_fixed or ap_ufixed type, preferably through
    a named typed constant
  - Keep intermediate widths and quantization or overflow modes identical to the immutable type contract
  forbidden_actions:
  - Do not replace the interface type with float or double
  - Do not change rounding, saturation, widths, or tolerances for QoR
  - Do not hard-code expected outputs
  must_hold_invariants:
  - Arithmetic value, signedness, integer bits, fractional bits, quantization mode, and overflow mode
    are preserved
  confidence: high
  source: AMD arbitrary-precision fixed-point types and Vitis C++ overload-resolution practice
  expected_stage_transition: Compile advances with identical fixed-point numerical semantics
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_STANDARD_LIBRARY_DECLARATION
  stage: compile
  priority: 128
  match:
    log_any:
    - (no member named|undeclared identifier|was not declared|no matching function)
    code_any:
    - \b(?:std::)?(?:sqrt|fabs|abs|floor|ceil|round|memcpy|memset|min|max|fill)\s*\(
    task_any:
    - \b(?:square root|absolute|round|copy|minimum|maximum|initialize)\b
  diagnosis: A required standard operation is used without a valid synthesizable declaration or with the
    wrong namespace/overload.
  allowed_actions:
  - Add only the exact standard header required by the operation, or replace a bulk operation with a bounded
    elementwise loop when the tool rejects it
  - Select an overload whose argument and result types follow the immutable task contract
  forbidden_actions:
  - Do not add host I/O, a testbench, using namespace std, or an unrelated umbrella header
  - Do not change the top function signature or array extents
  must_hold_invariants:
  - The mathematical operation and observable precision remain unchanged
  confidence: medium
  source: AMD UG1399 2024.2 C/C++ coding styles and manual HLS expert knowledge
  expected_stage_transition: Resolve the cited declaration or overload while preserving all immutable
    interfaces
  validation_required: *id001
  evidence_tier: generic
- rule_id: COMPILE_CONSTEXPR_ARRAY_EXTENT
  stage: compile
  priority: 127
  match:
    log_any:
    - variable length array
