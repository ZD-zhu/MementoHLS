- Prior v4-v7 error-class taxonomy; no reference kernel is read or prompted
- 'AMD UG1399 2024.2 Data Types: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/Data-Types'
- 'AMD UG1399 2024.2 Undefined Behaviors: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/Undefined-Behaviors'
- 'AMD UG1399 2024.2 Arrays on the Interface: https://docs.amd.com/r/2024.2-English/ug1399-vitis-hls/Arrays-on-the-Interface'
- 'Self-Refine, NeurIPS 2023: https://proceedings.neurips.cc/paper_files/paper/2023/file/91edff07232fb1b55a505a9e9f6c0ff3-Paper-Conference.pdf'
